name: flutter_continued_task
description: "A Flutter plugin to ensure process lifecycle continuation and progress synchronization during long-running tasks in background across Android and iOS."
version: 0.1.0
homepage: https://github.com/zellypaw/zelly-flutter

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutter.continued_task
        pluginClass: FlutterContinuedTaskPlugin
      ios:
        pluginClass: FlutterContinuedTaskPlugin
