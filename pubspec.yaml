name: flutter_continued_task
description: "A Flutter plugin to ensure process lifecycle continuation and progress synchronization during long-running tasks in background across Android and iOS."
version: 0.2.0
repository: https://github.com/toyaji/flutter_continued_task
issue_tracker: https://github.com/toyaji/flutter_continued_task/issues
topics:
  - background
  - foreground-service
  - bgtaskscheduler
  - lifecycle

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  checks: ^0.3.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.toyaji.continued_task
        pluginClass: FlutterContinuedTaskPlugin
      ios:
        pluginClass: FlutterContinuedTaskPlugin
